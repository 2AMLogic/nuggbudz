name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pairing is refused outright when this server can neither charge nor be
      # told not to (worker/env.ts, `ALLOW_UNCHARGED_PAIRING`) -- that fail-closed
      # behaviour is what the `payment-gate-closed` job below asserts. This lane
      # is about the pairing protocol rather than the money, so it opts out
      # explicitly, here, for this step's server only. Never `wrangler.jsonc`.
      # The operator allowlist for the dispute-resolution routes, which answer
      # 404 to everyone else -- including with the var unset, which is the shape
      # a checkout is in. The id is `BUYERS.op` in scripts/smoke.mjs, and
      # SMOKE_REQUIRE_ADMIN below turns "no operator configured" from a skip into
      # a failure, so a drift between the two cannot quietly delete this lane.
      # No upgrade limit is raised here (#106): the signed-in window is per buyer,
      # and every scenario is its own seeded account, so this suite runs against
      # the production figure rather than around it.
      - run: |
          {
            echo 'ALLOW_UNCHARGED_PAIRING="1"'
            echo 'OPERATOR_USER_IDS="5eed5eed-0000-4000-8000-000000000033"'
          } > .dev.vars
      # Live pairing across two WebSocket clients, against the real Worker.
      - run: pnpm dev --port 5199 &
      - run: npx wait-on http://localhost:5199/api/health --timeout 90000
      # A server that came up in any other mode would make every pickup-code
      # assertion below mean something different, so assert the mode first.
      - name: Assert the server came up uncharged
        run: |
          health="$(curl -sf http://localhost:5199/api/health)"
          echo "$health"
          node -e '
            const health = JSON.parse(process.argv[1])
            if (health.payments !== "uncharged") {
              console.error("expected payments: uncharged, got", health.payments)
              process.exit(1)
            }
          ' "$health"
      - run: SMOKE_REQUIRE_ADMIN=1 pnpm smoke
      # The uncharged branch of the money gate: an opted-in server pairs and
      # releases the code at match time, and nobody is asked to pay.
      - run: BASE=http://localhost:5199 pnpm payment-gate

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      # Same reasoning as the `smoke` job: this suite is about the screen, not the
      # money, so it opts out of charging explicitly rather than relying on the
      # absence of secrets -- which now refuses to pair at all.
      # The anonymous upgrade window is per connecting address, read off
      # `CF-Connecting-IP` -- which a local `pnpm dev` never sets, so every
      # signed-out browser here shares one `unknown` address, and every landing
      # page opens a browse socket from it (#150). That is a property of this
      # server, not a verdict on the production figure (wrangler.jsonc, derived
      # from a venue model), so it is raised for this step's server only. The
      # signed-in window is per buyer since #106 and needs nothing.
      - run: |
          {
            echo 'ALLOW_UNCHARGED_PAIRING="1"'
            echo 'POOL_ANON_UPGRADE_LIMIT="300"'
          } > .dev.vars
      # Drives the real UI in two browser contexts; playwright.config.ts's
      # webServer boots `pnpm dev` itself, so there is no separate wait-on step.
      - run: pnpm test:e2e

  demo-check:
    runs-on: ubuntu-latest
    # `smoke` (above) proves the strict authenticated path and fails closed if
    # `ALLOW_DEMO_PAIRING` is ever on — that's what makes it unsafe to also flip
    # the flag inside that job. This is a separate job, on its own runner and
    # its own checkout, so the two configurations never share a server.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Demo pairing (README.md "Demo pairing") is on only for THIS step's dev
      # server, via a `.dev.vars` written here and never committed — not
      # `wrangler.jsonc`, not a tracked `.dev.vars`, not a workflow- or
      # job-level `env:` a sibling job could inherit. `.dev.vars` is what
      # actually reaches `c.env` for `pnpm dev`; a bare shell env var does not.
      # Stripe is deliberately "configured" for this job, with a secret that is
      # not a secret and an API base that nothing is listening on. That is the
      # enforcement test for issue #3: a demo pair must never reach the payment
      # processor, so if `paymentDisposition` ever stopped answering `demo`
      # first, `createPaymentIntent` would try 127.0.0.1:9 (discard), fail, and
      # take the match down -- turning every assertion below red. Proving the
      # exclusion by breaking it is the only way to know the check is on the
      # path rather than merely present (cf. `isDealOffered`, `isDemoUserId`).
      - run: |
          {
            echo 'ALLOW_DEMO_PAIRING="1"'
            echo 'STRIPE_SECRET_KEY="sk_test_not_a_real_key"'
            echo 'STRIPE_WEBHOOK_SECRET="whsec_not_a_real_secret"'
            echo 'STRIPE_API_BASE="http://127.0.0.1:9/v1"'
          } > .dev.vars
      # Distinct port from `smoke` (5199) and `e2e` (playwright.config.ts,
      # which also defaults to 5199) so a stale/foreign server from a sibling
      # job's `reuseExistingServer`-style adoption can never be mistaken for
      # this one's.
      - run: pnpm dev --port 5211 &
      - run: npx wait-on http://localhost:5211/api/health --timeout 90000
      # A server that answered demoPairing: false would make every assertion
      # below vacuous rather than failing — demo-pairing-check.mjs takes
      # whichever branch /api/health reports instead of erroring on a mismatch.
      # Assert the mode explicitly before trusting anything demo-check reports.
      - name: Assert the server actually came up in demo mode
        run: |
          health="$(curl -sf http://localhost:5211/api/health)"
          echo "$health"
          node -e '
            const health = JSON.parse(process.argv[1])
            if (health.demoPairing !== true) {
              console.error("expected demoPairing: true, got", health.demoPairing)
              process.exit(1)
            }
          ' "$health"
      # The only end-to-end proof that a completed demo handoff books nothing
      # to the D1 ledger (issue #68) — a defect that shipped once and was only
      # caught in review.
      - run: BASE=http://localhost:5211 pnpm demo-check

  # The money gate, from the side that matters: no secrets, no opt-in. An
  # unconfigured pool must refuse to pair rather than hand two strangers a
  # working pickup code for a box nobody paid for. Its own job, on its own
  # runner, because the mode is a property of the whole server.
  payment-gate-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Deliberately no `.dev.vars` at all: this is the shape a deploy that lost
      # a `wrangler secret put` has.
      - run: pnpm dev --port 5248 &
      - run: npx wait-on http://localhost:5248/api/health --timeout 90000
      - name: Assert the server came up unconfigured
        run: |
          health="$(curl -sf http://localhost:5248/api/health)"
          echo "$health"
          node -e '
            const health = JSON.parse(process.argv[1])
            if (health.payments !== "unconfigured") {
              console.error("expected payments: unconfigured, got", health.payments)
              process.exit(1)
            }
          ' "$health"
      - run: BASE=http://localhost:5248 pnpm payment-gate

  # The charged path, end to end through the real Durable Object: two
  # PaymentIntents, a signed webhook per half, a pickup code released only after
  # the second one, and a D1 row only after the handshake. `scripts/fake-stripe.mjs`
  # answers the three REST calls so this needs no Stripe account -- `pnpm test`
  # cannot reach the Durable Object, and a payment gate exercised only as a pure
  # function is a payment gate nobody has exercised.
  payment-gate-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The fake Stripe is NOT started here. A backgrounded `&` step does not
      # reliably outlive the step that started it -- this job watched it print its
      # banner and then die before the next step ran -- so `payment-gate` hosts it
      # in its own process via `FAKE_STRIPE_SERVE` below. Nothing calls Stripe
      # until a match is struck, which cannot happen before that script runs.
      # The operator allowlist for the holds queue and the refund-retry route,
      # which answer 404 to everyone else -- including with the var unset, which
      # is the shape a checkout is in. The id is `BUYERS.op` in
      # scripts/payment-gate-check.mjs, and PAYMENT_GATE_REQUIRE_ADMIN below
      # turns "no operator configured" from a skip into a failure, so a drift
      # between the two cannot quietly delete this lane.
      - run: |
          {
            echo 'STRIPE_SECRET_KEY="sk_test_fake"'
            echo 'STRIPE_WEBHOOK_SECRET="whsec_fake_for_ci_only"'
            echo 'STRIPE_API_BASE="http://127.0.0.1:5312/v1"'
            echo 'OPERATOR_USER_IDS="9a1d9a1d-0000-4000-8000-000000000033"'
          } > .dev.vars
      - run: pnpm dev --port 5249 &
      - run: npx wait-on http://localhost:5249/api/health --timeout 90000
      - name: Assert the server came up live
        run: |
          health="$(curl -sf http://localhost:5249/api/health)"
          echo "$health"
          node -e '
            const health = JSON.parse(process.argv[1])
            if (health.payments !== "live") {
              console.error("expected payments: live, got", health.payments)
              process.exit(1)
            }
          ' "$health"
      - run: |
          BASE=http://localhost:5249 \
          FAKE_STRIPE=http://localhost:5312 \
          FAKE_STRIPE_SERVE=5312 \
          STRIPE_WEBHOOK_SECRET=whsec_fake_for_ci_only \
          PAYMENT_GATE_REQUIRE_ADMIN=1 \
          pnpm payment-gate

  # Honeypot buyers, in both directions, through the real Durable Object.
  #
  # `pnpm test` covers the decisions — the money gate's ordering, the
  # fallback-only matching rule, the reply table, the ledger exclusions — and
  # none of that is evidence any of it is wired. This job drives a real socket
  # into a real decoy pairing and checks every one of the things a decoy must
  # never do actually did not happen: no charge, no pickup code, no `matches`
  # row, no `disputes` row, no hold, no reputation counter, and nothing said to
  # it anywhere under `.wrangler/state`.
  #
  # Stripe is deliberately "configured" here with a secret that is not a secret
  # and an API base nothing is listening on — the same enforcement trick
  # `demo-check` uses (issue #3), for the same reason. If `paymentDisposition`
  # ever stopped answering `honeypot` before the secrets are consulted,
  # `createPaymentIntent` would try 127.0.0.1:9 (discard), fail, and take the
  # match down, turning this job red rather than leaving the exclusion true by
  # accident. `ALLOW_DEMO_PAIRING` is deliberately NOT set: a `demo:` identity
  # would be excluded by the demo branch and would make the whole lane vacuous.
  honeypot-check:
    runs-on: ubuntu-latest
    # Its own job, its own runner, its own checkout — `smoke` and `e2e` both
    # assert on empty markets, and a decoy roster is a property of the whole
    # server. The two configurations must never share one.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # First: the default. A server with no `HONEYPOT_BUYERS` at all must leave
      # a market honest — nothing seeded, nobody matched, no phantom dots. The
      # flag existing is not evidence that leaving it off still does nothing.
      - run: |
          {
            echo 'ALLOW_UNCHARGED_PAIRING="1"'
          } > .dev.vars
      - run: pnpm dev --port 5250 &
      - run: npx wait-on http://localhost:5250/api/health --timeout 90000
      - name: Assert the server came up with decoys off
        run: |
          health="$(curl -sf http://localhost:5250/api/health)"
          echo "$health"
          node -e '
            const health = JSON.parse(process.argv[1])
            if (health.honeypots !== false) {
              console.error("expected honeypots: false, got", health.honeypots)
              process.exit(1)
            }
          ' "$health"
      - run: BASE=http://localhost:5250 pnpm honeypot-check
      # Then the feature, on a second server with its own port and its own
      # `.dev.vars`. Stripe "configured" at a dead address is the enforcement.
      - run: |
          {
            echo 'HONEYPOT_BUYERS="1"'
            echo 'STRIPE_SECRET_KEY="sk_test_not_a_real_key"'
            echo 'STRIPE_WEBHOOK_SECRET="whsec_not_a_real_secret"'
            echo 'STRIPE_API_BASE="http://127.0.0.1:9/v1"'
          } > .dev.vars
      - run: pnpm dev --port 5251 &
      - run: npx wait-on http://localhost:5251/api/health --timeout 90000
      # A server that answered honeypots:false here would make every assertion
      # below vacuous rather than failing — honeypot-check.mjs takes whichever
      # branch /api/health reports. Assert the mode, and assert that Stripe is
      # live, before trusting anything the check reports.
      - name: Assert the server came up with decoys on and Stripe configured
        run: |
          health="$(curl -sf http://localhost:5251/api/health)"
          echo "$health"
          node -e '
            const health = JSON.parse(process.argv[1])
            if (health.honeypots !== true) {
              console.error("expected honeypots: true, got", health.honeypots)
              process.exit(1)
            }
            if (health.payments !== "live") {
              console.error("expected payments: live, got", health.payments)
              process.exit(1)
            }
          ' "$health"
      - run: BASE=http://localhost:5251 pnpm honeypot-check

  # The upgrade limiter's refusal, reachable off the wire (issue #105). A
  # browser handed a non-101 response from a `WebSocket` constructor never
  # sees the 429 body — it only fires `close` — so this is invisible to every
  # other job here: none of them goes near a limit, and `e2e` raises
  # `POOL_ANON_UPGRADE_LIMIT` specifically so its shared local address never
  # trips it. This job does
  # the opposite on purpose, with its own port and its own tiny window, so the
  # refusal is forced and the probe that is supposed to surface it is proved
  # to actually surface it.
  upgrade-rate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: echo 'POOL_ANON_UPGRADE_LIMIT="2"' > .dev.vars
      - run: pnpm dev --port 5252 &
      - run: npx wait-on http://localhost:5252/api/health --timeout 90000
      - run: BASE=http://localhost:5252 EXPECTED_ANON_UPGRADE_LIMIT=2 pnpm upgrade-rate-check

  # Somebody has to be told that `main` is red (issue #57).
  #
  # Every job above already runs on `push: branches: [main]` as well as on pull
  # requests, and has since the first commit — that is the *merge result* being
  # checked, which is the only place a whole class of defect is visible: four
  # times in one afternoon a pull request that was individually correct and
  # CI-green produced a broken `main` when it landed, three of those four with no
  # `git` conflict at all (identical edits merge clean; so do edits to different
  # lines of files whose semantics interact). Two of the four were caught only
  # because somebody happened to run `pnpm smoke` locally afterwards, and one had
  # already been on `main` for a while by then.
  #
  # So this job is not another check — it is the *watching* of the checks above.
  # It files one `loom:auditor` tracking issue and comments on that same issue on
  # every later failure, so a red `main` is something a human or the Auditor role
  # is handed rather than something the next person to run the suite discovers.
  #
  # It is deliberately not a gate: gating the merge result needs "require
  # branches to be up to date before merging" or a merge queue, a repo-admin
  # setting no workflow can grant itself. See CLAUDE.md, "A green pull request is
  # not a green `main`", for that decision and who has to make it.
  main-red-alert:
    runs-on: ubuntu-latest
    # Every other job in this workflow. `test/main-red-alert.test.ts` asserts
    # that this list stays complete, because a job added later and left out of it
    # would be watched by nobody and nothing would look wrong.
    needs: [check, smoke, e2e, demo-check, payment-gate-closed, payment-gate-live, honeypot-check, upgrade-rate-check]
    # `cancelled()` counts alongside `failure()`: on `main` there is no newer run
    # to supersede this one, so a cancelled job is a check that did not run, and a
    # check that did not run must never read as one that passed. A pull request is
    # excluded entirely — its failures are already on a pull request somebody is
    # looking at, and filing an issue per red PR run is noise.
    if: (failure() || cancelled()) && github.ref == 'refs/heads/main'
    permissions:
      # The only write this job needs, and the default GITHUB_TOKEN has it — no
      # new secret, unlike the branch-protection half of issue #57.
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No `pnpm install`: the alert must still go out when the failure was the
      # install itself, so this script uses nothing but Node's own `fetch`.
      - run: node scripts/main-red-alert.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEEDS_JSON: ${{ toJSON(needs) }}
