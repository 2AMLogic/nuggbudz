# Repository-level pnpm settings. This project has no workspace, so this file
# is purely pnpm's settings home (pnpm >= 10.16 reads settings from here).
#
# It has to answer whatever pnpm actually runs, and that is not a fixed
# version: every `pnpm/action-setup@v4` step in .github/workflows/ci.yml pins
# `version: 10`, which is a *floating* major resolved to the newest 10.x at job
# time (10.34.5 today), while a developer's own pnpm is usually 11. Both build
# allowlist spellings are declared on purpose (#61).
#
# Build scripts (#50). esbuild and workerd run postinstall builds that the
# lockfile already pins. With no allowlist key at all pnpm skips them: pnpm 11
# exits ERR_PNPM_IGNORED_BUILDS, pnpm 10 only prints "Ignored build scripts",
# which is the quieter, worse half. `allowBuilds` was backported into the pnpm
# 10 line at 10.26.0, so the pnpm CI resolves today (10.34.5) does honour it —
# but 10.20.0 through 10.25.0 silently ignore it, and a floating `version: 10`
# is free to resolve elsewhere tomorrow.
#   onlyBuiltDependencies is read by every pnpm 10.x, and still by 11
#   allowBuilds           is read by pnpm 10.26+ and by 11
# Declaring both is what makes the allowlist hold regardless of which 10.x the
# pin lands on — today's, an older one a contributor has locally, or whatever a
# future release brings. Verified on 10.34.5: both spellings, same install.
#
# Keep this block verifiable rather than narrative. It has now twice described
# a CI behaviour that was not happening, and no linter or install exit code
# checks prose; `test/pnpm-settings.test.ts` can only check the part that is
# mechanical — that every pinned major has a spelling it can read.
allowBuilds:
  esbuild: true
  workerd: true
onlyBuiltDependencies:
  - esbuild
  - workerd
# Release-age cooldown (#50). pnpm 11 refuses any package published within the
# last 24h; pnpm 10 does not enforce a cooldown at all, so this only ever
# governs a local pnpm 11 install and never CI. The blanket
# `minimumReleaseAge: 0` that used to sit here waived it for every package and
# every future `pnpm add`, which is much wider than the problem it was added
# for: this repo deliberately tracks Cloudflare's toolchain at the bleeding
# edge, and a wrangler/miniflare release is often hours old when it lands in
# the lockfile. Naming those three keeps the cooldown — and the supply-chain
# window it exists to close — on everything else.
minimumReleaseAgeExclude:
  - '@cloudflare/vite-plugin'
  - miniflare
  - wrangler
